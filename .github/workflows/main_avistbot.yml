name: Build and deploy ASP.Net Core app to Azure Web App - AvistBot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '6.0.x'
          include-prerelease: true

      - name: Build with dotnet
        run: dotnet build --configuration Release Aula_bot/PerreVergueBot.csproj

      - name: dotnet publish
        run: dotnet publish -c Release -o Donatelatrump/Telegram-bot-Web-scrapping-aula-virtual-UAA/Aula_bot/PerreVergueBot.csproj

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v2
        with:
        name: .net-app
        path: Donatelatrump/Telegram-bot-Web-scrapping-aula-virtual-UAA/Aula_bot/PerreVergueBot
  deploy:
    runs-on: windows-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v2
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'AvistBot'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A0F687C5D2F6477C81EB3AAB1413D936 }}
          package: .
